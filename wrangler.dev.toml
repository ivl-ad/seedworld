# Local API-only dev config: no [assets] block, so the file watcher cannot
# chase its own .wrangler state in a reload loop. Used for testing the worker;
# the real config stays wrangler.toml. Safe to delete.
name = "seedworld"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[durable_objects.bindings]]
name = "EXCHANGE"
class_name = "Exchange"

[[migrations]]
tag = "seedworld-v1"
new_sqlite_classes = ["World"]

[[migrations]]
tag = "seedworld-v2"
new_sqlite_classes = ["Exchange"]

[[d1_databases]]
binding = "DB"
database_name = "seedworld"
database_id = "35e33bd4-04d1-4bda-aae6-b312c7511835"

[vars]
ALLOWED_ORIGINS = ""
