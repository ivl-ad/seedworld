name = "seedworld"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/ws", "/register", "/save", "/health", "/play", "/name-check", "/characters", "/population"]

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "seedworld-v1"
new_sqlite_classes = ["World"]

[[d1_databases]]
binding = "DB"
database_name = "seedworld"
database_id = "35e33bd4-04d1-4bda-aae6-b312c7511835"

[vars]
ALLOWED_ORIGINS = "https://vla.dev"

[observability]
enabled = true
