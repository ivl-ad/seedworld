name = "PUT_YOUR_EXISTING_WORKER_NAME_HERE"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/ws", "/register", "/save", "/health", "/play", "/name-check"]

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "seedworld-v1"
new_sqlite_classes = ["World"]

[[d1_databases]]
binding = "DB"
database_name = "seedworld"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

[vars]
ALLOWED_ORIGINS = "https://vla.dev"

[observability]
enabled = true
